name: Bug report
description: Something behaves incorrectly or crashes — reproducible problem reports
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep it minimal and reproducible.

        **Do not paste real credentials, API keys, tokens, customer data, or production prompt content.**
        Redact log excerpts before pasting. Security issues must not be reported here — see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: DoboCache version
      description: Which version are you running? It is in package.json, and also reported by the cf_report tool.
      placeholder: 0.4.7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - WSL
        - Other (state it in the description)
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`.
      placeholder: v20.11.1
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      description: Which client is loading the server (name and version), and how is it configured — stdio or otherwise?
      placeholder: e.g. client name + version, transport, how the server was registered
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
      description: The smallest sequence that shows the problem. Exact tool names and arguments matter here.
      placeholder: |
        1. Start the server with ...
        2. Call tool `...` with arguments `{...}`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text or the exact output, not a paraphrase.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      description: |
        Optional. If the issue involves the white-box report or its JSONL log, include the
        `logDir` and `logDirSource` values returned by cf_report, plus the relevant lines only.
      render: text
    validations:
      required: false

  - type: dropdown
    id: whitebox
    attributes:
      label: Is the white-box report involved?
      options:
        - "No — the issue happens with the default configuration"
        - "Yes — DOBOCACHE_WHITEBOX is enabled"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed credentials, tokens, personal paths and any personal data from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
