name: publish-mcp-registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mp.tar.gz
          tar -xzf /tmp/mp.tar.gz -C /tmp mcp-publisher
          install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help

      - name: Wait until npm serves the declared version
        run: |
          set -euo pipefail
          VER=$(jq -r .version server.json)
          for i in $(seq 1 60); do
            HAVE=$(curl -fsS https://registry.npmjs.org/dobocache/latest | jq -r .version || true)
            if [ "$HAVE" = "$VER" ]; then
              echo "npm latest=$VER, ready to publish to the registry"
              exit 0
            fi
            echo "npm latest=$HAVE, waiting for $VER (attempt $i/60)..."
            sleep 10
          done
          echo "timed out waiting for npm to serve version $VER"
          exit 1

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to official MCP Registry
        run: mcp-publisher publish
