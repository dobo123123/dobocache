name: CI

# Cross-platform continuous integration.
# Runs install + type-check + lint + full unit tests on Windows, Linux and macOS,
# plus an MCP stdio handshake smoke test on Linux and macOS so real-platform
# behavior is verified on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 让 npm / node 输出更稳定，避免 CI 日志噪声
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS 托管 runner 在本仓曾长期排不到机器（run 41858839250 / 41870257274 均排队
    # 约 15 分钟后被平台取消，runner_id 全程为 null），把整体 run 拖成 failure。
    # 因此 macOS 仅作非阻塞补充验证：它失败不使 workflow 失败，但仍照常发车与报告。
    # 反例留档：run 41893788049 的 macOS job 实际分配到 runner 并 19 秒全绿，
    # 说明是「排队资源紧张 + 排队超时被取消」，不是平台不可用，故保留矩阵项而非移除。
    # macos-latest 现为 Apple Silicon(arm64)、macos-13 为 Intel(x64)，两个架构都留在矩阵里；
# 曾试过单独用 macos-14 建 arm64 专项 job，本仓解析为 "macos-14-arm64-us-default" 不受支持，1 秒即失败，故不采用。
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: false
      # 每个平台单独给超时（v0.5.2 · P1 处置选项 1）：
      # macos-13 是 GitHub 托管 Intel runner，供给紧张时长时间排队、最后被平台取消，
      # 一旦被取消也会把 job 拖满整个 timeout。把它单独压到 5 分钟，
      # 好处是不再拖累整条流水线的时长；代价是偶尔仍会看到 cancelled —— 这是平台侧
      # 供给问题，本仓无法消除，故保留矩阵项（对外"Intel 架构在 CI 矩阵内"的表述依然成立）。
      matrix:
        include:
          # macos-latest 现为 Apple Silicon(arm64)、macos-13 为 Intel(x64)，两种架构都覆盖
          - os: windows-latest
            timeout: 12
          - os: ubuntu-latest
            timeout: 12
          - os: macos-latest
            timeout: 12
          - os: macos-13
            timeout: 5
    # 实测正常跑完全流程 windows 39s / ubuntu 25s / macos 19s，余量充足。
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖（严格按 package-lock）
        run: npm ci

      - name: 类型编译（tsc）
        run: npm run build

      # v0.5.2 新增：纯类型检查（不产出 dist），与 build 分开跑，
      # 便于在日志里一眼区分"类型错了"和"产物没生成"
      - name: 类型检查（tsc --noEmit）
        run: npm run typecheck

      - name: 代码检查（eslint）
        run: npm run lint

      - name: 全量单元测试（vitest）
        run: npm test

      # v0.5.2 新增（P0 回归守卫）：v0.5.1 的对外首屏命令是坏的，而当时 CI 全绿 ——
      # 原因是没有任何一支测试真跑过那条命令。这一步用 dist 产物真跑三条路径：
      #   ① node dist/index.js dobostitch status → 入口必须转发到代理
      #   ② node dist/proxy/cli.js status        → 原 bin 路径不得被破坏
      #   ③ node dist/index.js + initialize      → 无参启动必须仍是纯 MCP server
      - name: 首屏命令冒烟（入口转发 / 原 bin / MCP 主路径）
        run: npm run smoke

      # 文档一致性：版本号 / 结构 / 链接 / 对外元数据口径，任一漂移即失败
      - name: 文档一致性校验（check-docs）
        run: node scripts/check-docs.mjs

      # 非 Windows 平台额外验证：
      #   1) MCP stdio 握手：initialize 返回 serverInfo(dobocache) + tools/list 恰好 9 个工具
      #   2) 日志目录解析：macOS 必须落在 ~/Library/Logs/DoboCache，Linux 必须落在 $XDG_STATE_HOME/dobocache
      #      且 cf_report 返回的 logDirSource 必须为 platform（证明走平台分支，不是 cwd 回退）
      - name: MCP 握手冒烟 + 日志目录断言（Linux / macOS）
        if: runner.os != 'Windows'
        run: node scripts/ci-mcp-smoke.mjs

      - name: 上传冒烟失败现场（仅失败时）
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-trace-${{ matrix.os }}
          path: ci-smoke-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
