name: Publish to npm

# Token-free publishing via npm Trusted Publishing (OIDC).
#
# Why this exists:
#   npm will restrict "bypass 2FA" granular tokens for direct publishing
#   starting 2027-01. OIDC trusted publishing replaces the long-lived token:
#   GitHub mints a short-lived OIDC token per run, npm exchanges it, no secret
#   is ever stored in the repo or in repo settings.
#
# Requirements (both sides must match exactly):
#   1. npmjs.com -> package dobocache -> Settings/Access -> Trusted Publisher
#      must be bound to: owner=dobo123123, repo=dobocache,
#      workflow filename=publish.yml, allowed action "npm publish" checked.
#   2. This file must live at .github/workflows/publish.yml on the default branch.
#
# Trigger: push a tag like v0.4.9 -> publishes that version.
# The tag must match package.json version, otherwise the run fails fast.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC token exchange with npm

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Type-check / build (tsc)
        run: npm run build

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Docs consistency (check-docs)
        run: node scripts/check-docs.mjs

      # Guard: refuse to publish when the tag and package.json disagree.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # npm >= 11.5.1 exchanges the OIDC token automatically; no NODE_AUTH_TOKEN.
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public
